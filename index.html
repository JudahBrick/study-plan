<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Interview Plan">
<title>SWE Interview Plan</title>
<style>
:root{--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--mute:#62615d;--line:#e1e0d9;--axis:#c3c2b7;--acc:#2a78d6;--acc-track:#cde2fb;
--ok:#1f7a45;--warn:#9a5d00;--bad:#c2372f;--good:#0ca30c;--good-text:#006300;--chip:#efeee9;
--h0:#e1e0d9;--h1:#86b6ef;--h2:#5598e7;--h3:#256abf;--h4:#104281}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--mute:#a8a79f;--line:#2c2c2a;--axis:#383835;--acc:#3987e5;--acc-track:rgba(57,135,229,.18);
--ok:#1f7a45;--warn:#9a5d00;--bad:#d03b3b;--good:#0ca30c;--good-text:#0ca30c;--chip:#262624;
--h0:#2c2c2a;--h1:#184f95;--h2:#256abf;--h3:#3987e5;--h4:#86b6ef}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--acc)}
header{padding:16px 16px 8px;max-width:860px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;
padding:6px 12px;max-width:860px;margin:0 auto}
nav button{flex:0 0 auto;border:0;background:none;color:var(--mute);font-size:14px;padding:8px 10px;border-radius:8px}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
main{max-width:860px;margin:0 auto;padding:12px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;margin:4px 6px 0 0}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.bad{color:var(--bad)}
.note{border-left:4px solid var(--warn);padding:8px 12px;background:var(--card);border-radius:8px;margin:8px 0}
.note.good{border-color:var(--ok)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details>summary{padding:12px 14px;cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details .body{padding:0 10px 10px}
.ph-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ph-h b{font-size:16px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:14px 4px 4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;margin-top:1px;flex:0 0 auto}
.task .t{flex:1;min-width:0}
.task .meta{color:var(--mute);font-size:12px}
.task.done .ttl{text-decoration:line-through;color:var(--mute)}
.task .nt{font-size:13px;color:var(--mute);margin-top:4px;display:none}
.task.open .nt{display:block}
.info{border:0;background:none;color:var(--mute);font-size:13px;padding:0 4px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--mute);margin-left:4px}
.flash{font-size:18px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.back{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-size:16px}
textarea{width:100%;min-height:90px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;
background:var(--bg);color:var(--ink);padding:8px}
pre{white-space:pre-wrap;font:12.5px ui-monospace,Menlo,monospace;background:var(--chip);padding:10px;border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute)}
.big{font-size:28px;font-weight:700}
.stat{display:inline-block;margin-right:18px}
.big-btn{font-size:17px;padding:12px 20px}
.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px;-webkit-text-fill-color:var(--ink);opacity:1}
.opt.right{border-color:var(--good);box-shadow:inset 5px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.verdict{font-weight:700;margin:6px 0 2px}.verdict.right{color:var(--good-text)}.verdict.wrong{color:var(--bad)}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grade3 .btn{margin:0;padding:12px 4px}
.gright{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}.gwrong{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.hero .herofig{font-size:48px;font-weight:700;line-height:1.1;margin:2px 0 10px}
.meter{height:10px;background:var(--acc-track);border-radius:6px;overflow:hidden;margin:6px 0}.meter>i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}.meter.big{height:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tlabel{font-size:12px;color:var(--mute)}.tval{font-size:24px;font-weight:600}.tsub{font-size:12px;color:var(--mute)}
svg.path{max-width:440px;display:block;margin:8px auto;overflow:visible}
.trail{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round}.trail.lit{stroke:var(--acc)}
.bannerbg{fill:var(--chip)}.banner{font-size:11px;font-weight:700;letter-spacing:.06em;fill:var(--mute)}.banner.dim{opacity:.6}
.node{cursor:pointer;outline:none}.node .hit{fill:transparent}.node .track{fill:none;stroke:var(--acc-track);stroke-width:6}
.node .arc{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round}
.node .disc{fill:var(--card);stroke:var(--line);stroke-width:1}
.node.done .track,.node.done .arc{stroke:var(--good)}.node.done .disc{fill:var(--good);stroke:var(--good)}.node.done .icon{fill:#fff;font-size:20px;font-weight:700}
.node.locked{opacity:.5}.node.locked .track{stroke:var(--line)}
.node .icon{font-size:22px;text-anchor:middle}.node.boss .icon{font-size:26px}.node.boss .disc{stroke:var(--axis);stroke-width:2}
.node:focus-visible .disc{stroke:var(--acc);stroke-width:3}
.halo{fill:none;stroke:var(--acc);stroke-width:3;opacity:.45;animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.1}}@media (prefers-reduced-motion:reduce){.halo{animation:none}}
.nlabel{font-size:13px;font-weight:600;fill:var(--ink)}.nsub{font-size:11px;fill:var(--mute)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));
box-shadow:0 -8px 24px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .2s;z-index:20;max-width:860px;margin:0 auto;border-radius:14px 14px 0 0}#sheet.on{transform:none}
.bars{margin-top:6px}.barrow{display:grid;grid-template-columns:minmax(110px,170px) 1fr 52px;gap:10px;align-items:center;margin:8px 0}.blabel{font-size:13px}
.bval{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}.barrow .meter{margin:0}
svg.heat{max-width:520px;display:block;margin:8px 0 4px}.heat .axis{font-size:9px;fill:var(--mute)}.heat rect{cursor:pointer}.todaycell{stroke:var(--ink);stroke-width:1.5}
.h0{fill:var(--h0);background:var(--h0)}.h1{fill:var(--h1);background:var(--h1)}.h2{fill:var(--h2);background:var(--h2)}.h3{fill:var(--h3);background:var(--h3)}.h4{fill:var(--h4);background:var(--h4)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
details.inner{border:0;margin:6px 0 0;background:none}details.inner>summary{padding:6px 0;color:var(--acc);font-size:13px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}@media (min-width:640px){.badges{grid-template-columns:repeat(6,1fr)}}
.badge{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;opacity:.55}.badge.got{opacity:1;border-color:var(--acc)}
.lvl{font-size:13px;color:var(--mute)}.lvl select{font-size:14px;margin-left:4px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.learn{font-size:13px;margin-top:10px;line-height:1.6}
.bicon{font-size:26px}.bname{font-size:12px;font-weight:600}.bdesc{font-size:11px;color:var(--mute)}
</style>
</head>

-calls/","notes":"Goal is the idiom, not the algorithm: collections.deque popleft. Write it the most Pythonic way you can."},{"id":"P0-R10","title":"Sort Array by Increasing Frequency (Python ramp)","tier":"red","min":20,"phase":0,"track":"Python ramp","kind":"task","url":"https://leetcode.com/problems/sort-array-by-increasing-frequency/","notes":"Goal is the idiom, not the algorithm: sorted(key=lambda) with tuples. Write it the most Pythonic way you can."},{"id":"G0","title":"GATE 0: write Counter / defaultdict / deque / heapq / bisect usage from memory, all 10 ramp problems done","tier":"yellow","min":10,"phase":0,"track":"Gate","kind":"gate","notes":"Honest self-check. If shaky, redo 3 ramp problems before moving on."},{"id":"PR-ARRAYS-1","title":"Night-before primer: Arrays & Hashing","tier":"yellow","min":20,"phase":1,"track":"LeetCode core","kind":"task","url":"https://neetcode.io/roadmap","notes":"Watch NeetCode's video for \"Contains Duplicate\" and read the matching pattern cards. Watching is fine here; attempting the problem for the first time is not, that's tomorrow's deep session.","cat":"Arrays & Hashing"},{"id":"LC-contains-duplicate","title":"Contains Duplicate","tier":"red","min":25,"phase":1,"track":"LeetCode core","kind":"lc","url":"https://leetcode.com/problems/contains-duplicate/","cat":"Arrays & Hashing","diff":"E","rev":15},{"id":"LC-valid-anagram","title":"Valid Anagram","tier":"red","min":25,"phase":1,"track":"LeetCode core","kind":"lc","url":"https://leetcode.com/problems/valid-anagram/","cat":"Arrays & Hashing","diff":"E","rev":15},{"id":"LC-two-sum","title":"Two Sum","tier":"red","min":25,"phase":1,"track":"LeetCode core","kind":"lc","url":"https://leetcode.com/problems/two-sum/","cat":"Arrays & Hashing","diff":"E","rev":15},{"id":"LC-group-anagrams","title":"Group Anagrams","tier":"red","min":45,"phase":1,"track":"LeetCode core","kind":"lc","url":"https://leetcode.com/problems/group-anagrams/","cat":"Arrays & Hashing","diff":"M","rev":20}
