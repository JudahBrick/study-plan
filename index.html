lkthroughs"},{"id":"LIB-V19","title":"Design Uber w/ a Ex-Meta Staff Engineer: System Design Interview breakdown","tier":"yellow","min":63,"phase":5,"track":"Library","kind":"library","unlock":2,"url":"https://www.youtube.com/watch?v=lsKU38RKQSo","notes":"Geo indexing, high-frequency location updates, matching consistency.","optional":true,"media":"video","source":"Hello Interview","topic":"System design walkthroughs"},{"id":"LIB-V20","title":"Design Whatsapp: System Design Interview w/ a Ex-Meta Senior Manager","tier":"yellow","min":58,"phase":5,"track":"Library","kind":"library","unlock":2,"url":"https://www.youtube.com/watch?v=cr6p0n0N-VA","notes":"WebSocket connection management, delivery guarantees, offline sync.","optional":true,"media":"video","source":"Hello Interview","topic":"System design walkthroughs"},{"id":"LIB-V21","title":"Design a Key-Value Store - System Design Mock Interview (with Microsoft Software Engineer)","tier":"yellow","min":37,"phase":5,"track":"Library","kind":"library","unlock":2,"url":"https://www.youtube.com/watch?v=6fOoXT1HYxk","notes":"A real mock (interviewer + candidate) on a classic distributed-systems prompt.","optional":true,"media":"video","source":"Aced (formerly Exponent)","topic":"System design walkthroughs"},{"id":"LIB-V22","title":"The Python Global Interpreter Lock - Explained","tier":"green","min":5,"phase":5,"track":"Library","kind":"library","unlock":3,"url":"https://www.youtube.com/watch?v=XVcRQ6T9RHo","notes":"What the GIL means for threads vs processes.","optional":true,"media":"video","source":"Tech With Tim","topic":"Concurrency"},{"id":"LIB-V23","title":"Concurrency in Low-level Design Interviews w/ Staff Engineer","tier":"yellow","min":23,"phase":5,"track":"Library","kind":"library","unlock":3,"url":"https://www.youtube.com/watch?v=d8rmosXttTE","notes":"Locks, races and thread safety as they come up in interview designs.","optional":true,"media":"video","source":"Hello Interview","topic":"Concurrency"},{"id":"LIB-V24","title":"Multithreading in Java Explained in 10 Minutes","tier":"green","min":10,"phase":5,"track":"Library","kind":"library","unlock":3,"url":"https://www.youtube.com/watch?v=r_MbozD32eo","notes":"Fast refresher on Java threads, Runnable, join.","optional":true,"media":"video","source":"Coding with John","topic":"Concurrency"},{"id":"LIB-V25","title":"10 Design Patterns Explained in 10 Minutes","tier":"green","min":11,"phase":5,"track":"Library","kind":"library","unlock":3,"url":"https://www.youtube.com/watch?v=tv-_1er1mWI","notes":"Classic patterns refresher before an OOD round.","optional":true,"media":"video","source":"Fireship","topic":"OOD"},{"id":"LIB-V26","title":"Low-Level Design Interview: Design an Elevator w/ a Ex-Meta Staff Engineer","tier":"yellow","min":61,"phase":5,"track":"Library","kind":"library","unlock":3,"url":"https://www.youtube.com/watch?v=fODT0ldeBiU","notes":"Full LLD walkthrough: requirements, entities, classes, extensibility.","optional":true,"media":"video","source":"Hello Interview","topic":"OOD"},{"id":"LIB-V27","title":"Behavioral Interview: Common Questions Broken Down by Ex-Meta & Amazon Senior Managers","tier":"yellow","min":67,"phase":5,"track":"Library","kind":"library","unlock":2,"url":"https://www.youtube.com/watch?v=CAda15Tawlg","notes":"What strong senior-level answers sound like, from hiring managers.","optional":true,"media":"video","source":"Hello Interview","topic":"Behavioral"},{"id":"LIB-V28","title":"Senior FAANG Engineer Behavioral Mock Interview | With Analysis","tier":"yellow","min":78,"phase":5,"track":"Library","kind":"library","unlock":2,"url":"https://www.youtube.com/watch?v=c3TE7h9gA4g","notes":"A full senior behavioral mock with commentary afterwards.","optional":true,"media":"video","source":"Aced (formerly Exponent)","topic":"Behavioral"}],"guide":[{"title":"How this plan works","html":"\n<p><b>Phases move on gates, not dates.<\/b> Target weeks assume about 6 deep hours a week (16 weeks). At 3 hours a week the same plan takes about 24 weeks, and that's fine. When you pass a phase's gate, you move on.<\/p>\n<p><b>Every task has a mode:<\/b><\/p>\n<ul>\n<li>🔴 <b>Deep<\/b>: at a desk, fresh, 60-90 min, no distractions. New LeetCode problems, timed designs, bug hunts, mocks.<\/li>\n<li>🟡 <b>Low energy<\/b>: tired evening or couch, 20-40 min. Re-solving problems you've done, watching explanation videos, reading, drafting stories.<\/li>\n<li>🟢 <b>Phone<\/b>: commute, one hand, 10-30 min. Cards, reading articles, rehearsing stories.<\/li>\n<\/ul>\n<p><b>The one rule:<\/b> a <i>new<\/i> LeetCode problem only ever happens in 🔴. Attempting a new problem tired burns it: you'll half-solve it, peek at the answer, and lose most of the learning. Tired? Do re-solves (🟡) or cards (🟢) instead.<\/p>\n<p><b>Night-before primers<\/b> (🟡) are where you watch the NeetCode video for a new pattern, so the next 🔴 session is pure solving.<\/p>"},{"title":"Pick your level","html":"\n<p>Use the <b>Level<\/b> picker at the top. The plan is the same for everyone; your level decides which tasks are <b>required<\/b> (they count toward gates and progress) and which become <b>optional<\/b> (still visible, never blocking).<\/p>\n<table><tr><th>Level<\/th><th>What changes<\/th><\/tr>\n<tr><td>New grad / junior (L3)<\/td><td>All 90 core problems. System design is a short intro (framework, core concepts, one design). OOD and 2 practical-coding sessions required. Concurrency optional. Light debugging and behavioral.<\/td><\/tr>\n<tr><td>Mid-level (L4)<\/td><td>All core problems. 5 designs + replication/partitioning reading. Concurrency basics (Python), all practical coding, most debugging, full behavioral.<\/td><\/tr>\n<tr><td>Senior (L5)<\/td><td>Everything in the original plan: 10 designs, DDIA depth, concurrency in Python and Java, full debugging track.<\/td><\/tr>\n<tr><td>Staff+ (L6+)<\/td><td>Senior plus every design, staff-only drills (design doc of your own system, multi-region design, 10x evolution), leadership stories and a project deep dive. OOD becomes optional.<\/td><\/tr><\/table>\n<p>Switching levels never loses progress; it only changes what counts.<\/p>"},{"title":"Minimum viable week (a bad week)","html":"\n<p>When life happens, do just this and you keep momentum:<\/p>\n<ul><li>🔴 3 new problems<\/li><li>🟡 5 re-solves from the Reviews tab<\/li><li>🟢 Cards on your commutes<\/li><\/ul>\n<p>A good week (about 6 deep hours) adds more new problems and, from phase 2 on, one system design or breadth session.<\/p>"},{"title":"How to work a LeetCode problem (deep session)","html":"\n<ol>\n<li><b>Understand<\/b> (3 min): restate the problem, ask about constraints, write 2 examples including an edge case.<\/li>\n<li><b>Approach<\/b> (5-7 min): brute force first, then name the pattern. Say the time/space complexity <i>before<\/i> coding.<\/li>\n<li><b>Code<\/b> (15 min): clean names, helper functions, no cleverness.<\/li>\n<li><b>Test<\/b> (5 min): walk your examples by hand, then the edge cases.<\/li>\n<li><b>Stuck at 25 min?<\/b> Watch only the first third of the NeetCode explanation, close it, and finish yourself. Mark it <i>Needed help<\/i>. That's not failure; the review queue brings it back sooner.<\/li>\n<\/ol>\n<p>Re-solves (🟡) are the same problem from a blank editor, about 15-20 min. If it flows, mark <i>Clean<\/i>. If not, <i>Struggled<\/i> resets its schedule.<\/p>"},{"title":"System design: the 45-minute framework","html":"\n<ol>\n<li><b>Requirements<\/b> (5 min): functional (3-4 core use cases), non-functional (scale, latency, consistency, availability). State what is <i>out<\/i> of scope.<\/li>\n<li><b>Estimates<\/b> (2-3 min, only where they drive a decision): QPS, storage, bandwidth.<\/li>\n<li><b>API and data model<\/b> (5 min).<\/li>\n<li><b>High-level design<\/b> (10 min): a box diagram that satisfies the use cases.<\/li>\n<li><b>Deep dives<\/b> (15-20 min): you pick the 2-3 hardest parts (hot keys, consistency, fan-out, failure). Name the trade-offs out loud.<\/li>\n<li><b>Wrap<\/b> (2 min): bottlenecks, what you'd monitor, how it evolves.<\/li>\n<\/ol>\n<p><b>Senior signals:<\/b> you drive the conversation without being prompted, quantify, compare 2 options before choosing, cover failure modes, and know when <i>not<\/i> to add a component.<\/p>"},{"title":"Python for interviews cheat sheet","html":"\n<pre>from collections import Counter, defaultdict, deque, OrderedDict\nimport heapq, bisect\nfrom functools import cache            # @cache for memoized DP\n\ncnt = Counter(s); cnt.most_common(2)   # [(item, n), ...]\ng = defaultdict(list); g[u].append(v)  # adjacency list\nq = deque([start]); q.popleft()        # O(1) BFS queue (never list.pop(0))\nh = []; heapq.heappush(h, (dist, node)); heapq.heappop(h)   # MIN-heap\nheapq.heappush(h, -x)                  # max-heap: negate\nheapq.nlargest(k, nums)\ni = bisect.bisect_left(arr, x)         # first index with arr[i] >= x\ngrid = [[0] * n for _ in range(m)]     # NOT [[0]*n]*m (shared rows!)\nfor i, (a, b) in enumerate(zip(xs, ys)): ...\nsorted(items, key=lambda t: (-t[1], t[0]))\nq, r = divmod(a, b); INF = float('inf')\n''.join(parts)                         # never += strings in a loop\nod = OrderedDict(); od.move_to_end(k); od.popitem(last=False)   # LRU\nimport sys; sys.setrecursionlimit(10**6)   # deep DFS (or go iterative)<\/pre>"},{"title":"Resources (all already paid for or free)","html":"\n<ul>\n<li><b>NeetCode Pro<\/b>: roadmap order, video explanations, the system design course as a light refresher. <a href=\"https://neetcode.io/roadmap\">neetcode.io/roadmap<\/a><\/li>\n<li><b>LeetCode Premium<\/b>: locked problems (🔒 in this plan), the Concurrency section, frequency sort, Mock Assessments.<\/li>\n<li><b>Hello Interview (free tier)<\/b>: framework, core concepts, deep dives, problem write-ups. Reads well on a phone. <a href=\"https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction\">start here<\/a><\/li>\n<li><b>roadmap.sh System Design<\/b> (free, optional): a visual map of every system design topic, good for spotting gaps on your phone. <a href=\"https://roadmap.sh/system-design\">roadmap.sh/system-design<\/a><\/li>\n<li><b>DDIA<\/b> (owned): the senior-depth chapters are in the plan. <b>System Design Interview Vol 1<\/b> (owned).<\/li>\n<li><b>Optional upgrades:<\/b> Xu Vol 2 (infra-heavy chapters), Hello Interview Premium ($95/yr: patterns pages + concurrency course), paid mocks (the most-praised spend in reviews, not required).<\/li>\n<li><b>Anki<\/b>: the Cards tab is built in and free. If you'd rather use Anki, Sync tab → Export cards. AnkiMobile is $25 on iPhone; reviewing on ankiweb.net in Safari is free.<\/li>\n<\/ul>"},{"title":"Using Claude with this plan","html":"\n<p>Open a terminal in this folder and run <code>claude<\/code>. Then just talk:<\/p>\n<ul>\n<li>\"I have 40 minutes and I'm tired, what should I do?\"<\/li>\n<li>\"Mark Two Sum done, needed help.\" / \"Mark group anagrams clean.\"<\/li>\n<li>\"Sync this: IPK1....\" (paste from the phone's Sync tab)<\/li>\n<li>\"Give me a code for my phone.\"<\/li>\n<li>\"Add a card: I keep forgetting that ...\"<\/li>\n<li>\"Start DBG-01.\" / \"Start PRC-02.\" / \"Am I ready for the gate?\"<\/li>\n<\/ul>\n<p>When you're solving, Claude gives hints, not answers, unless you ask for the answer.<\/p>"}],"review_intervals_days":[3,7,21],"drift_days":10,"new_cards_per_day":8},"cards":[{"id":"patter-01","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Longest substring with at most K distinct characters.","options":["Sliding window (variable size)","Two pointers on sorted input","Dynamic programming","Binary search"],"answer":"Sliding window (variable size)","back":"Contiguous + 'longest/shortest with a condition' = sliding window. Expand right, shrink left while invalid. O(n).","learn":[{"t":"NeetCode video: Longest Substring with At Most K Distinct Characters","u":"https://www.youtube.com/results?search_query=neetcode+Longest+Substring+with+At+Most+K+Distinct+Characters"},{"t":"Practice: Longest Substring with At Most K Distinct Characters","u":"https://leetcode.com/problems/longest-substring-with-at-most-k-distinct-characters/"}]},{"id":"patter-02","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Sorted array: find two numbers summing to a target with O(1) extra space.","options":["Two pointers from both ends","Hash map of seen values","Binary search for each element","Sliding window"],"answer":"Two pointers from both ends","back":"Sorted order tells you which pointer to move: sum too small, move left up; too big, move right down. O(n), O(1) space. A hash map works but uses O(n) space.","learn":[{"t":"NeetCode video: Two Sum II","u":"https://www.youtube.com/results?search_query=neetcode+Two+Sum+II"},{"t":"Practice: Two Sum II","u":"https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"}]},{"id":"patter-03","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"For each day, how many days until a warmer temperature?","options":["Monotonic stack","Min-heap","Sliding window","Prefix sums"],"answer":"Monotonic stack","back":"'Next greater element' = monotonic stack of indices. Each index is pushed and popped once, so O(n).","learn":[{"t":"NeetCode video: Daily Temperatures","u":"https://www.youtube.com/results?search_query=neetcode+Daily+Temperatures"},{"t":"Practice: Daily Temperatures","u":"https://leetcode.com/problems/daily-temperatures/"}]},{"id":"patter-04","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Smallest eating speed that finishes all piles within H hours.","options":["Binary search on the answer","Greedy: sort the piles","Dynamic programming","Max-heap"],"answer":"Binary search on the answer","back":"Feasibility is monotonic in the speed (faster always works if slower did), so binary search the speed and check each candidate in O(n).","learn":[{"t":"NeetCode video: Koko Eating Bananas","u":"https://www.youtube.com/results?search_query=neetcode+Koko+Eating+Bananas"},{"t":"Practice: Koko Eating Bananas","u":"https://leetcode.com/problems/koko-eating-bananas/"}]},{"id":"patter-05","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Find the minimum of a rotated sorted array in O(log n).","options":["Binary search comparing mid to the right end","Linear scan","Two pointers from both ends","Min-heap"],"answer":"Binary search comparing mid to the right end","back":"If nums[mid] > nums[right], the minimum is right of mid; otherwise it's at mid or to its left.","learn":[{"t":"NeetCode video: Find Minimum in Rotated Sorted Array","u":"https://www.youtube.com/results?search_query=neetcode+Find+Minimum+in+Rotated+Sorted+Array"},{"t":"Practice: Find Minimum in Rotated Sorted Array","u":"https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/"}]},{"id":"patter-06","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Does a linked list have a cycle? Use O(1) extra space.","options":["Fast and slow pointers","Hash set of visited nodes","Reverse the list","Recursion"],"answer":"Fast and slow pointers","back":"Floyd: if there's a cycle the fast pointer laps the slow one. A hash set works but is O(n) space.","learn":[{"t":"NeetCode video: Linked List Cycle","u":"https://www.youtube.com/results?search_query=neetcode+Linked+List+Cycle"},{"t":"Practice: Linked List Cycle","u":"https://leetcode.com/problems/linked-list-cycle/"}]},{"id":"patter-07","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Cache with O(1) get/put that evicts the least recently used key.","options":["Hash map + doubly linked list","Min-heap keyed by last-used time","Hash map + singly linked list","Sorted array of timestamps"],"answer":"Hash map + doubly linked list","back":"The map finds the node in O(1); the doubly linked list moves or removes it in O(1). A singly linked list can't unlink a node without its predecessor.","learn":[{"t":"NeetCode video: LRU Cache","u":"https://www.youtube.com/results?search_query=neetcode+LRU+Cache"},{"t":"Practice: LRU Cache","u":"https://leetcode.com/problems/lru-cache/"}]},{"id":"patter-08","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Group words that are anagrams of each other.","options":["Hash map keyed by a canonical form","Sort the whole word list","Trie of all words","Union-find"],"answer":"Hash map keyed by a canonical form","back":"Key = sorted letters, or a 26-letter count tuple. Words with the same key are anagrams. O(n * k log k) or O(n * k).","learn":[{"t":"NeetCode video: Group Anagrams","u":"https://www.youtube.com/results?search_query=neetcode+Group+Anagrams"},{"t":"Practice: Group Anagrams","u":"https://leetcode.com/problems/group-anagrams/"}]},{"id":"patter-09","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Maximum of every window of size k, in O(n).","options":["Monotonic deque","Max-heap of the window","Sort each window","Prefix maximums"],"answer":"Monotonic deque","back":"Keep indices in a deque with decreasing values; pop the front when it leaves the window. A heap gives O(n log k).","learn":[{"t":"NeetCode video: Sliding Window Maximum","u":"https://www.youtube.com/results?search_query=neetcode+Sliding+Window+Maximum"},{"t":"Practice: Sliding Window Maximum","u":"https://leetcode.com/problems/sliding-window-maximum/"}]},{"id":"patter-10","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Count subarrays whose sum equals k. Values can be negative.","options":["Prefix sums + hash map of counts","Sliding window","Two pointers","Binary search"],"answer":"Prefix sums + hash map of counts","back":"With negative values, shrinking a window doesn't reliably lower the sum, so a sliding window breaks. Count earlier prefixes equal to (prefix - k).","learn":[{"t":"NeetCode video: Subarray Sum Equals K","u":"https://www.youtube.com/results?search_query=neetcode+Subarray+Sum+Equals+K"},{"t":"Practice: Subarray Sum Equals K","u":"https://leetcode.com/problems/subarray-sum-equals-k/"}]},{"id":"patter-11","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Merge k sorted linked lists efficiently.","options":["Min-heap of the current list heads","Concatenate everything, then sort","Merge the lists one by one, left to right","Two pointers"],"answer":"Min-heap of the current list heads","back":"The heap gives O(N log k). Merging left to right is O(N * k). Merging in pairs (divide and conquer) also reaches O(N log k).","learn":[{"t":"NeetCode video: Merge K Sorted Lists","u":"https://www.youtube.com/results?search_query=neetcode+Merge+K+Sorted+Lists"},{"t":"Practice: Merge K Sorted Lists","u":"https://leetcode.com/problems/merge-k-sorted-lists/"}]},{"id":"patter-12","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Length of the longest run of consecutive integers in an unsorted array, in O(n).","options":["Hash set; start counting only where x-1 is missing","Sort, then scan","Union-find","Dynamic programming"],"answer":"Hash set; start counting only where x-1 is missing","back":"Only sequence starts begin a count, so each number is visited O(1) times. Sorting is O(n log n).","learn":[{"t":"NeetCode video: Longest Consecutive Sequence","u":"https://www.youtube.com/results?search_query=neetcode+Longest+Consecutive+Sequence"},{"t":"Practice: Longest Consecutive Sequence","u":"https://leetcode.com/problems/longest-consecutive-sequence/"}]},{"id":"patter-13","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Product of all elements except self, without division.","options":["Prefix products + suffix products","Hash map of products","Two pointers","Divide and conquer"],"answer":"Prefix products + suffix products","back":"answer[i] = (product of everything left of i) * (product of everything right of i). Two passes, O(n).","learn":[{"t":"NeetCode video: Product of Array Except Self","u":"https://www.youtube.com/results?search_query=neetcode+Product+of+Array+Except+Self"},{"t":"Practice: Product of Array Except Self","u":"https://leetcode.com/problems/product-of-array-except-self/"}]},{"id":"patter-14","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Get a key's value as of timestamp t: the latest value set at or before t.","options":["Per-key time-sorted list + binary search","Hash map keyed by (key, t)","A min-heap per key","Scan every write"],"answer":"Per-key time-sorted list + binary search","back":"Timestamps arrive in increasing order, so each key's list stays sorted. Binary search for the last time <= t.","learn":[{"t":"NeetCode video: Time Based Key-Value Store","u":"https://www.youtube.com/results?search_query=neetcode+Time+Based+Key-Value+Store"},{"t":"Practice: Time Based Key-Value Store","u":"https://leetcode.com/problems/time-based-key-value-store/"}]},{"id":"patter-15","type":"mcq","deck":"Pattern recognition","unlock":1,"front":"Check that every bracket in a string is matched and properly nested.","options":["Stack","Counter of open brackets","Two pointers","Queue"],"answer":"Stack","back":"A single counter can't tell '(]' from '()'. Push opening brackets; each closer must match the top.","learn":[{"t":"NeetCode video: Valid Parentheses","u":"https://www.youtube.com/results?search_query=neetcode+Valid+Parentheses"},{"t":"Practice: Valid Parentheses","u":"https://leetcode.com/problems/valid-parentheses/"}]},{"id":"patter-16","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Return a binary tree's values level by level.","options":["BFS with a queue","In-order DFS","Union-find","Binary search"],"answer":"BFS with a queue","back":"Process len(queue) nodes per round, and each round is one level. DFS that tracks depth also works, but BFS is the natural fit.","learn":[{"t":"NeetCode video: Binary Tree Level Order Traversal","u":"https://www.youtube.com/results?search_query=neetcode+Binary+Tree+Level+Order+Traversal"},{"t":"Practice: Binary Tree Level Order Traversal","u":"https://leetcode.com/problems/binary-tree-level-order-traversal/"}]},{"id":"patter-17","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Is this binary tree a valid BST?","options":["DFS passing (low, high) bounds down","Compare each node only with its children","BFS, checking each level is sorted","Count the nodes"],"answer":"DFS passing (low, high) bounds down","back":"A node must respect every ancestor, not just its parent. (An in-order traversal that's strictly increasing also works.)","learn":[{"t":"NeetCode video: Validate Binary Search Tree","u":"https://www.youtube.com/results?search_query=neetcode+Validate+Binary+Search+Tree"},{"t":"Practice: Validate Binary Search Tree","u":"https://leetcode.com/problems/validate-binary-search-tree/"}]},{"id":"patter-18","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Maximum path sum; the path can start and end at any node.","options":["Post-order DFS: return the best downward gain, update a global max","BFS keeping a running sum","Pre-order DFS storing full paths","Sort the node values"],"answer":"Post-order DFS: return the best downward gain, update a global max","back":"At each node: best = node + max(0, left gain) + max(0, right gain). Return node + max(left, right, 0) to the parent.","learn":[{"t":"NeetCode video: Binary Tree Maximum Path Sum","u":"https://www.youtube.com/results?search_query=neetcode+Binary+Tree+Maximum+Path+Sum"},{"t":"Practice: Binary Tree Maximum Path Sum","u":"https://leetcode.com/problems/binary-tree-maximum-path-sum/"}]},{"id":"patter-19","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Find every dictionary word that appears on a letter grid.","options":["Trie + DFS backtracking","BFS separately for each word","Union-find on the cells","Sliding window over rows"],"answer":"Trie + DFS backtracking","back":"One DFS walks the board and the trie together, pruning dead prefixes. Searching word by word repeats the same work.","learn":[{"t":"NeetCode video: Word Search II","u":"https://www.youtube.com/results?search_query=neetcode+Word+Search+II"},{"t":"Practice: Word Search II","u":"https://leetcode.com/problems/word-search-ii/"}]},{"id":"patter-20","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Median of a stream of numbers, after every insert.","options":["Two heaps: max-heap for the low half, min-heap for the high half","Re-sort the list after every insert","One min-heap","Hash map of counts"],"answer":"Two heaps: max-heap for the low half, min-heap for the high half","back":"Keep the sizes within 1 of each other; the median comes from the tops. O(log n) per insert, O(1) per query.","learn":[{"t":"NeetCode video: Find Median from Data Stream","u":"https://www.youtube.com/results?search_query=neetcode+Find+Median+from+Data+Stream"},{"t":"Practice: Find Median from Data Stream","u":"https://leetcode.com/problems/find-median-from-data-stream/"}]},{"id":"patter-21","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Generate all subsets of a set.","options":["Backtracking (include or exclude each item)","Greedy","BFS shortest path","Binary search"],"answer":"Backtracking (include or exclude each item)","back":"There are 2^n subsets, each built in O(n), so O(n * 2^n). Sort first if you have to skip duplicates.","learn":[{"t":"NeetCode video: Subsets","u":"https://www.youtube.com/results?search_query=neetcode+Subsets"},{"t":"Practice: Subsets","u":"https://leetcode.com/problems/subsets/"}]},{"id":"patter-22","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Count the islands in a grid of land and water.","options":["Flood fill (DFS/BFS) from each unvisited land cell","Dijkstra","Topological sort","Sliding window"],"answer":"Flood fill (DFS/BFS) from each unvisited land cell","back":"Each flood fill marks one island. O(rows * cols). Union-find also works.","learn":[{"t":"NeetCode video: Number of Islands","u":"https://www.youtube.com/results?search_query=neetcode+Number+of+Islands"},{"t":"Practice: Number of Islands","u":"https://leetcode.com/problems/number-of-islands/"}]},{"id":"patter-23","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Minutes until every orange rots, spreading from many rotten oranges at once.","options":["Multi-source BFS","DFS from each rotten orange separately","Dijkstra","Union-find"],"answer":"Multi-source BFS","back":"Put every source in the queue at time 0; each BFS layer is one minute.","learn":[{"t":"NeetCode video: Rotting Oranges","u":"https://www.youtube.com/results?search_query=neetcode+Rotting+Oranges"},{"t":"Practice: Rotting Oranges","u":"https://leetcode.com/problems/rotting-oranges/"}]},{"id":"patter-24","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Can you finish all courses, given prerequisite pairs?","options":["Topological sort / cycle detection in a directed graph","Union-find","BFS shortest path","Greedy by course number"],"answer":"Topological sort / cycle detection in a directed graph","back":"Kahn's algorithm: if you process fewer than V nodes, there's a cycle. Union-find detects cycles in UNDIRECTED graphs, not directed ones.","learn":[{"t":"NeetCode video: Course Schedule","u":"https://www.youtube.com/results?search_query=neetcode+Course+Schedule"},{"t":"Practice: Course Schedule","u":"https://leetcode.com/problems/course-schedule/"}]},{"id":"patter-25","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Which edge closes a cycle in an undirected graph that started as a tree?","options":["Union-find","Topological sort","Dijkstra","Kahn's algorithm"],"answer":"Union-find","back":"Process the edges in order; the first edge whose endpoints already share a root is the redundant one.","learn":[{"t":"NeetCode video: Redundant Connection","u":"https://www.youtube.com/results?search_query=neetcode+Redundant+Connection"},{"t":"Practice: Redundant Connection","u":"https://leetcode.com/problems/redundant-connection/"}]},{"id":"patter-26","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Shortest word-to-word transformation, changing one letter at a time.","options":["BFS over an implicit graph","DFS","Dijkstra with random weights","2-D DP"],"answer":"BFS over an implicit graph","back":"Unweighted shortest path = BFS. Generate neighbors on the fly, e.g. with wildcard patterns like 'h*t'.","learn":[{"t":"NeetCode video: Word Ladder","u":"https://www.youtube.com/results?search_query=neetcode+Word+Ladder"},{"t":"Practice: Word Ladder","u":"https://leetcode.com/problems/word-ladder/"}]},{"id":"patter-27","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Time for a signal to reach every node of a weighted directed graph (weights >= 0).","options":["Dijkstra","BFS","Topological sort","Union-find"],"answer":"Dijkstra","back":"Plain BFS ignores the weights. Dijkstra with a min-heap: O((V + E) log V).","learn":[{"t":"NeetCode video: Network Delay Time","u":"https://www.youtube.com/results?search_query=neetcode+Network+Delay+Time"},{"t":"Practice: Network Delay Time","u":"https://leetcode.com/problems/network-delay-time/"}]},{"id":"patter-28","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Work out the letter order of an alien language from its sorted word list.","options":["Edges from first differing letters, then topological sort","Sort the letters alphabetically","Union-find","Trie alone"],"answer":"Edges from first differing letters, then topological sort","back":"Adjacent words give one ordering edge each. Watch for the invalid case where a longer word comes before its own prefix.","learn":[{"t":"NeetCode video: Alien Dictionary","u":"https://www.youtube.com/results?search_query=neetcode+Alien+Dictionary"},{"t":"Practice: Alien Dictionary","u":"https://leetcode.com/problems/alien-dictionary/"}]},{"id":"patter-29","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Fewest coins to make an amount (e.g. coins 1, 3, 4; amount 6).","options":["DP over the amounts","Greedy: always take the largest coin","Binary search","Two pointers"],"answer":"DP over the amounts","back":"Greedy gives 4+1+1 (3 coins), but 3+3 (2 coins) is optimal. dp[a] = 1 + min(dp[a - coin]).","learn":[{"t":"NeetCode video: Coin Change","u":"https://www.youtube.com/results?search_query=neetcode+Coin+Change"},{"t":"Practice: Coin Change","u":"https://leetcode.com/problems/coin-change/"}]},{"id":"patter-30","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Number of ways to decode a digit string into letters (1=A ... 26=Z).","options":["1-D DP","Backtracking without memoization","Greedy","Sliding window"],"answer":"1-D DP","back":"dp[i] = dp[i-1] (one valid digit) + dp[i-2] (a valid two-digit code). Plain backtracking is exponential.","learn":[{"t":"NeetCode video: Decode Ways","u":"https://www.youtube.com/results?search_query=neetcode+Decode+Ways"},{"t":"Practice: Decode Ways","u":"https://leetcode.com/problems/decode-ways/"}]},{"id":"patter-31","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Fewest single-character edits to turn one word into another.","options":["2-D DP over prefixes","Greedy character matching","Two pointers","Sort both words"],"answer":"2-D DP over prefixes","back":"dp[i][j] = the cost for the prefixes; insert, delete or replace come from three neighbouring cells. O(m * n).","learn":[{"t":"NeetCode video: Edit Distance","u":"https://www.youtube.com/results?search_query=neetcode+Edit+Distance"},{"t":"Practice: Edit Distance","u":"https://leetcode.com/problems/edit-distance/"}]},{"id":"patter-32","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Fewest meeting rooms needed for a list of meetings.","options":["Sort by start + min-heap of end times","Sort by end, greedily count","Union-find","Binary search"],"answer":"Sort by start + min-heap of end times","back":"Pop from the heap while its earliest end <= the new start; the heap's largest size is the answer. Sorting by end is the different problem of max non-overlapping meetings.","learn":[{"t":"NeetCode video: Meeting Rooms II","u":"https://www.youtube.com/results?search_query=neetcode+Meeting+Rooms+II"},{"t":"Practice: Meeting Rooms II","u":"https://leetcode.com/problems/meeting-rooms-ii/"}]},{"id":"patter-33","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Remove the fewest intervals so the rest don't overlap.","options":["Greedy: sort by END, keep the earliest-ending interval","Sort by start, then merge","Min-heap of end times","Backtracking"],"answer":"Greedy: sort by END, keep the earliest-ending interval","back":"Ending earliest leaves the most room. An exchange argument proves it.","learn":[{"t":"NeetCode video: Non-overlapping Intervals","u":"https://www.youtube.com/results?search_query=neetcode+Non-overlapping+Intervals"},{"t":"Practice: Non-overlapping Intervals","u":"https://leetcode.com/problems/non-overlapping-intervals/"}]},{"id":"patter-34","type":"mcq","deck":"Pattern recognition","unlock":2,"front":"Maximum sum of a contiguous subarray.","options":["Kadane's algorithm","Sort, then take the largest values","Binary search","Two pointers from both ends"],"answer":"Kadane's algorithm","back":"cur = max(x, cur + x); best = max(best, cur). For a maximum product, track both the min and the max.","learn":[{"t":"NeetCode video: Maximum Subarray","u":"https://www.youtube.com/results?search_query=neetcode+Maximum+Subarray"},{"t":"Practice: Maximum Subarray","u":"https://leetcode.com/problems/maximum-subarray/"}]},{"id":"comple-01","type":"mcq","deck":"Complexity","unlock":0,"front":"BFS or DFS over a graph with V vertices and E edges.","options":["O(V + E)","O(V * E)","O(V^2) always","O(E log V)"],"answer":"O(V + E)","back":"Each vertex and each edge is handled a constant number of times.","learn":[{"t":"Breadth-first search (Wikipedia)","u":"https://en.wikipedia.org/wiki/Breadth-first_search"},{"t":"Depth-first search (Wikipedia)","u":"https://en.wikipedia.org/wiki/Depth-first_search"}]},{"id":"comple-02","type":"mcq","deck":"Complexity","unlock":0,"front":"Dijkstra's algorithm with a binary heap.","options":["O((V + E) log V)","O(V + E)","O(V^2 * E)","O(E^2)"],"answer":"O((V + E) log V)","back":"Each edge relaxation may push onto the heap at O(log V). A Fibonacci heap improves it, but nobody codes that in an interview.","learn":[{"t":"Dijkstra's algorithm (Wikipedia)","u":"https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm"},{"t":"NeetCode video: Network Delay Time","u":"https://www.youtube.com/results?search_query=neetcode+Network+Delay+Time"}]},{"id":"comple-03","type":"mcq","deck":"Complexity","unlock":0,"front":"Generating all subsets of n items.","options":["O(n * 2^n)","O(n^2)","O(n!)","O(n log n)"],"answer":"O(n * 2^n)","back":"2^n subsets, O(n) each to copy out.","learn":[{"t":"Power set (Wikipedia)","u":"https://en.wikipedia.org/wiki/Power_set"},{"t":"NeetCode video: Subsets","u":"https://www.youtube.com/results?search_query=neetcode+Subsets"}]},{"id":"comple-04","type":"mcq","deck":"Complexity","unlock":0,"front":"Generating all permutations of n items.","options":["O(n * n!)","O(n * 2^n)","O(n^2)","O(n^3)"],"answer":"O(n * n!)","back":"n! orderings, O(n) each.","learn":[{"t":"NeetCode video: Permutations","u":"https://www.youtube.com/results?search_query=neetcode+Permutations"},{"t":"Practice: Permutations","u":"https://leetcode.com/problems/permutations/"}]},{"id":"comple-05","type":"mcq","deck":"Complexity","unlock":0,"front":"Top-k of n items using a size-k min-heap.","options":["O(n log k)","O(n log n)","O(k log n)","O(n * k)"],"answer":"O(n log k)","back":"Each of the n items costs at most one O(log k) push/pop. Quickselect is O(n) on average.","learn":[{"t":"NeetCode video: Kth Largest Element in an Array","u":"https://www.youtube.com/results?search_query=neetcode+Kth+Largest+Element+in+an+Array"},{"t":"Quickselect (Wikipedia)","u":"https://en.wikipedia.org/wiki/Quickselect"}]},{"id":"comple-06","type":"mcq","deck":"Complexity","unlock":0,"front":"Building a heap from an unsorted array (heapify).","options":["O(n)","O(n log n)","O(log n)","O(n^2)"],"answer":"O(n)","back":"Most nodes are near the bottom and sift only a short distance. n separate pushes would cost O(n log n).","learn":[{"t":"Binary heap: building a heap (Wikipedia)","u":"https://en.wikipedia.org/wiki/Binary_heap"}]},{"id":"comple-07","type":"mcq","deck":"Complexity","unlock":0,"front":"Binary search on an answer range of size R, where each check costs O(n).","options":["O(n log R)","O(R * n)","O(log n)","O(n + R)"],"answer":"O(n log R)","back":"log R candidates, each checked in O(n).","learn":[{"t":"NeetCode video: Koko Eating Bananas","u":"https://www.youtube.com/results?search_query=neetcode+Koko+Eating+Bananas"}]},{"id":"comple-08","type":"mcq","deck":"Complexity","unlock":0,"front":"Union-find with path compression and union by rank: cost per operation.","options":["Nearly O(1) (inverse Ackermann)","O(log n)","O(n)","Exactly O(1)"],"answer":"Nearly O(1) (inverse Ackermann)","back":"alpha(n) is at most 4 for any realistic n. With only one of the two optimizations you get O(log n).","learn":[{"t":"Disjoint-set data structure (Wikipedia)","u":"https://en.wikipedia.org/wiki/Disjoint-set_data_structure"}]},{"id":"comple-09","type":"mcq","deck":"Complexity","unlock":0,"front":"Inserting a word of length L into a trie.","options":["O(L)","O(L log n)","O(n)","O(1)"],"answer":"O(L)","back":"One node per character; the number of stored words doesn't matter.","learn":[{"t":"Trie (Wikipedia)","u":"https://en.wikipedia.org/wiki/Trie"}]},{"id":"comple-10","type":"mcq","deck":"Complexity","unlock":0,"front":"Removing from the FRONT of a dynamic array.","options":["O(n)","O(1)","O(log n)","Amortized O(1)"],"answer":"O(n)","back":"Every remaining element shifts left. That's why BFS uses a deque or a ring buffer.","learn":[{"t":"Dynamic array (Wikipedia)","u":"https://en.wikipedia.org/wiki/Dynamic_array"},{"t":"Python deque docs","u":"https://docs.python.org/3/library/collections.html#collections.deque"}]},{"id":"comple-11","type":"mcq","deck":"Complexity","unlock":0,"front":"Lower bound for any comparison-based sort.","options":["Omega(n log n)","Omega(n)","Omega(log n)","Omega(n^2)"],"answer":"Omega(n log n)","back":"There are n! possible orderings, so a decision tree needs log(n!) = Theta(n log n) comparisons. Counting and radix sort avoid comparisons.","learn":[{"t":"Comparison sort: lower bound (Wikipedia)","u":"https://en.wikipedia.org/wiki/Comparison_sort"}]},{"id":"comple-12","type":"mcq","deck":"Complexity","unlock":0,"front":"Call-stack space for recursive DFS on a completely skewed tree of n nodes.","options":["O(n)","O(log n)","O(1)","O(n log n)"],"answer":"O(n)","back":"The recursion depth equals the tree height, which is n when the tree is a single chain. For a balanced tree it's O(log n).","learn":[{"t":"Depth-first search (Wikipedia)","u":"https://en.wikipedia.org/wiki/Depth-first_search"}]},{"id":"comple-13","type":"flip","deck":"Complexity","unlock":0,"front":"Hash map lookup: average vs. worst case, and what causes the worst case?","back":"Average O(1). Worst O(n), when many keys collide into one bucket (bad hash or adversarial keys).","learn":[{"t":"Hash table (Wikipedia)","u":"https://en.wikipedia.org/wiki/Hash_table"}]},{"id":"comple-14","type":"flip","deck":"Complexity","unlock":0,"front":"Naive recursive Fibonacci vs. memoized: time complexity?","back":"Naive: exponential (about 1.6^n), because subproblems are recomputed. Memoized: O(n), each subproblem solved once. That's the whole point of DP.","learn":[{"t":"Memoization (Wikipedia)","u":"https://en.wikipedia.org/wiki/Memoization"},{"t":"Dynamic programming (Wikipedia)","u":"https://en.wikipedia.org/wiki/Dynamic_programming"}]},{"id":"datast-01","type":"flip","deck":"Data structures","unlock":1,"front":"Monotonic stack: what does it keep, and why is it O(n)?","back":"Elements in increasing (or decreasing) order. Each element is pushed once and popped at most once, so the total work is O(n) despite the nested loop.","learn":[{"t":"NeetCode video: Daily Temperatures","u":"https://www.youtube.com/results?search_query=neetcode+Daily+Temperatures"}]},{"id":"datast-02","type":"flip","deck":"Data structures","unlock":1,"front":"Why does a sliding window fail for 'subarray sum = k' when values can be negative?","back":"Shrinking the window no longer guarantees a smaller sum, so the monotonic property the window relies on breaks. Use prefix sums + a hash map.","learn":[{"t":"NeetCode video: Subarray Sum Equals K","u":"https://www.youtube.com/results?search_query=neetcode+Subarray+Sum+Equals+K"},{"t":"Practice: Subarray Sum Equals K","u":"https://leetcode.com/problems/subarray-sum-equals-k/"}]},{"id":"datast-03","type":"flip","deck":"Data structures","unlock":1,"front":"Heap: what does the heap property guarantee, and what doesn't it?","back":"Each parent <= its children (min-heap), so the minimum is O(1) to read. It does NOT keep elements sorted; there's no fast search for arbitrary values.","learn":[{"t":"Heap (Wikipedia)","u":"https://en.wikipedia.org/wiki/Heap_(data_structure)"}]},{"id":"datast-04","type":"flip","deck":"Data structures","unlock":1,"front":"When is greedy correct?","back":"When an exchange argument shows the greedy choice is never worse than any alternative (e.g. intervals by end time). If you can't argue it, use DP.","learn":[{"t":"Greedy algorithm (Wikipedia)","u":"https://en.wikipedia.org/wiki/Greedy_algorithm"}]},{"id":"datast-05","type":"flip","deck":"Data structures","unlock":2,"front":"Top-down vs. bottom-up DP: when to pick which?","back":"Top-down (memoized recursion) is fastest to write and only visits the states it needs. Bottom-up (a table) avoids recursion limits and makes space optimization easy.","learn":[{"t":"Dynamic programming (Wikipedia)","u":"https://en.wikipedia.org/wiki/Dynamic_programming"},{"t":"NeetCode video: Climbing Stairs","u":"https://www.youtube.com/results?search_query=neetcode+Climbing+Stairs"}]},{"id":"datast-06","type":"flip","deck":"Data structures","unlock":2,"front":"BFS vs. DFS: when must it be BFS?","back":"Shortest path in an unweighted graph, and level-order output. DFS is simpler for exhaustive search, connectivity and backtracking.","learn":[{"t":"Breadth-first search (Wikipedia)","u":"https://en.wikipedia.org/wiki/Breadth-first_search"}]},{"id":"datast-07","type":"flip","deck":"Data structures","unlock":2,"front":"Kahn's algorithm: how does it detect a cycle?","back":"If the number of nodes processed (dequeued with in-degree 0) is less than V, the leftover nodes are in a cycle.","learn":[{"t":"Topological sorting (Wikipedia)","u":"https://en.wikipedia.org/wiki/Topological_sorting"},{"t":"NeetCode video: Course Schedule","u":"https://www.youtube.com/results?search_query=neetcode+Course+Schedule"}]},{"id":"datast-08","type":"flip","deck":"Data structures","unlock":2,"front":"Trie vs. hash set of words: what does the trie buy you?","back":"Prefix queries, and pruning a search as soon as a prefix matches no word (Word Search II). A hash set only answers whole-word lookups.","learn":[{"t":"Trie (Wikipedia)","u":"https://en.wikipedia.org/wiki/Trie"},{"t":"NeetCode video: Word Search II","u":"https://www.youtube.com/results?search_query=neetcode+Word+Search+II"}]},{"id":"datast-09","type":"flip","deck":"Data structures","unlock":2,"front":"Two-heap median: the invariant?","back":"The max-heap holds the lower half and the min-heap the upper half, with sizes differing by at most 1. The median is a top, or the average of both tops.","learn":[{"t":"NeetCode video: Find Median from Data Stream","u":"https://www.youtube.com/results?search_query=neetcode+Find+Median+from+Data+Stream"}]},{"id":"datast-10","type":"flip","deck":"Data structures","unlock":2,"front":"Union-find: the two optimizations and what each does?","back":"Path compression flattens the tree on find. Union by rank/size attaches the smaller tree under the larger. Together: about O(1) per operation.","learn":[{"t":"Disjoint-set data structure (Wikipedia)","u":"https://en.wikipedia.org/wiki/Disjoint-set_data_structure"},{"t":"NeetCode video: Redundant Connection","u":"https://www.youtube.com/results?search_query=neetcode+Redundant+Connection"}]},{"id":"interv-01","type":"flip","deck":"Interview process","unlock":1,"front":"The first 5 minutes of a coding interview?","back":"Restate the problem, ask about constraints and edge cases, work 2 examples, state a brute force with its complexity, THEN optimize. Agree on the approach before coding.","learn":[{"t":"Tech Interview Handbook: coding interview techniques","u":"https://www.techinterviewhandbook.org/coding-interview-techniques/"}]},{"id":"interv-02","type":"flip","deck":"Interview process","unlock":1,"front":"Stuck for 5 minutes. Three moves?","back":"1) Shrink it: small n, or what if the input were sorted? 2) Write the brute force and find its repeated work. 3) Match the constraints to patterns you know.","learn":[{"t":"Tech Interview Handbook: coding interview techniques","u":"https://www.techinterviewhandbook.org/coding-interview-techniques/"}]},{"id":"interv-03","type":"flip","deck":"Interview process","unlock":1,"front":"What do the input-size constraints tell you?","back":"n <= 20: exponential/backtracking is fine. n <= 10^3 to 10^4: O(n^2) may pass. n <= 10^5 to 10^6: you need O(n log n) or O(n).","learn":[{"t":"Tech Interview Handbook: coding interview cheatsheet","u":"https://www.techinterviewhandbook.org/coding-interview-cheatsheet/"}]},{"id":"interv-04","type":"flip","deck":"Interview process","unlock":1,"front":"How do you test your code out loud?","back":"Walk a small example line by line, then edge cases: empty input, one element, duplicates, negatives, the maximum size. Say the complexity at the end.","learn":[{"t":"Tech Interview Handbook: coding interview cheatsheet","u":"https://www.techinterviewhandbook.org/coding-interview-cheatsheet/"}]},{"id":"system-01","type":"mcq","deck":"System design","unlock":2,"front":"Users can't see their own new post on refresh: reads go to lagging async replicas. Best fix?","options":["Read-your-writes: send that user's reads to the leader for a short time","Add more replicas","Put a CDN in front","Accept it: eventual consistency"],"answer":"Read-your-writes: send that user's reads to the leader for a short time","back":"Or track the user's last write version and only read from replicas that have caught up to it.","learn":[{"t":"Eventual consistency (Wikipedia)","u":"https://en.wikipedia.org/wiki/Eventual_consistency"},{"t":"Hello Interview: core concepts","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/core-concepts"}]},{"id":"system-02","type":"mcq","deck":"System design","unlock":2,"front":"A user with 50M followers posts. Feed strategy?","options":["Hybrid: pull celebrity posts at read time, push for everyone else","Fan-out on write to all 50M feeds","Fan-out on read for every user","Cache every feed for 24 hours"],"answer":"Hybrid: pull celebrity posts at read time, push for everyone else","back":"Pushing to 50M feeds per post is too expensive; pulling for everyone makes every read slow. The hybrid is the standard answer.","learn":[{"t":"Hello Interview: Design a news feed","u":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/fb-news-feed"}]},{"id":"system-03","type":"mcq","deck":"System design","unlock":2,"front":"Which cache write strategy can LOSE data if the cache node crashes?","options":["Write-back","Write-through","Cache-aside","Read-through"],"answer":"Write-back","back":"Write-back acknowledges the write before it reaches the database. It's fast, but writes not yet flushed are lost in a crash.","learn":[{"t":"AWS Builders' Library: caching challenges and strategies","u":"https://aws.amazon.com/builders-library/caching-challenges-and-strategies/"}]},{"id":"system-04","type":"mcq","deck":"System design","unlock":2,"front":"Stop double charges when a client retries a payment request.","options":["Idempotency key stored with the result","Exponential backoff","Longer timeouts","Two-phase commit across every service"],"answer":"Idempotency key stored with the result","back":"The server stores (key, result); a retry with the same key gets the stored result instead of a second charge.","learn":[{"t":"Stripe: designing APIs with idempotency","u":"https://stripe.com/blog/idempotency"},{"t":"AWS Builders' Library: making retries safe","u":"https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"}]},{"id":"system-05","type":"mcq","deck":"System design","unlock":2,"front":"In a quorum system, R + W > N guarantees that...","options":["Every read overlaps at least one replica that has the latest write","No data is lost under any failure","Linearizability in every situation","Writes never conflict"],"answer":"Every read overlaps at least one replica that has the latest write","back":"Read and write sets intersect. Sloppy quorums, clock skew and concurrent writes still need care (versioning, read repair).","learn":[{"t":"Quorum (Wikipedia)","u":"https://en.wikipedia.org/wiki/Quorum_(distributed_computing)"},{"t":"Werner Vogels on Amazon's Dynamo","u":"https://www.allthingsdistributed.com/2007/10/amazons_dynamo.html"}]},{"id":"system-06","type":"mcq","deck":"System design","unlock":2,"front":"One product page suddenly gets 100x the traffic of any other (a hot key).","options":["Cache it, coalesce requests, and/or replicate the hot key","Re-shard the database by user_id","Lower the cache TTL to 1 second","Make all calls synchronous"],"answer":"Cache it, coalesce requests, and/or replicate the hot key","back":"Hot keys defeat sharding because one key lives on one shard. Spread reads with caching, request coalescing, or salted key copies (key#1..n).","learn":[{"t":"AWS Builders' Library: caching challenges","u":"https://aws.amazon.com/builders-library/caching-challenges-and-strategies/"},{"t":"Hello Interview: Redis deep dive","u":"https://www.hellointerview.com/learn/system-design/deep-dives/redis"}]},{"id":"system-07","type":"mcq","deck":"System design","unlock":2,"front":"What does 'exactly-once' processing of click events mean in practice?","options":["At-least-once delivery + idempotent or deduplicated processing","The queue guarantees it automatically","Sending events over UDP","A 2PC transaction per event"],"answer":"At-least-once delivery + idempotent or deduplicated processing","back":"Networks retry, so duplicates happen. Make processing idempotent with event IDs, dedupe tables, or transactional checkpoints.","learn":[{"t":"Hello Interview: ad click aggregator","u":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/ad-click-aggregator"},{"t":"Hello Interview: Kafka deep dive","u":"https://www.hellointerview.com/learn/system-design/deep-dives/kafka"}]},{"id":"system-08","type":"mcq","deck":"System design","unlock":2,"front":"Update a database row and publish an event, without ever doing one but not the other.","options":["Transactional outbox (or change data capture from the DB log)","Write to the DB, then publish inside a try/catch","Publish first, then write","Use a longer timeout"],"answer":"Transactional outbox (or change data capture from the DB log)","back":"The outbox row commits in the same transaction as the update; a relay publishes it afterwards. That's the dual-write problem solved.","learn":[{"t":"microservices.io: transactional outbox","u":"https://microservices.io/patterns/data/transactional-outbox.html"}]},{"id":"system-09","type":"mcq","deck":"System design","unlock":2,"front":"Find all drivers within 2 km, fast.","options":["A geospatial index (geohash, quadtree or H3 cells)","Scan every driver and compute the distance","A B-tree on latitude only","A hash map by driver ID"],"answer":"A geospatial index (geohash, quadtree or H3 cells)","back":"Bucket nearby points together and query the neighbouring cells. Redis GEO or PostGIS work at moderate scale.","learn":[{"t":"Hello Interview: Design Uber","u":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/uber"},{"t":"Geohash (Wikipedia)","u":"https://en.wikipedia.org/wiki/Geohash"}]},{"id":"system-10","type":"mcq","deck":"System design","unlock":2,"front":"The server must push messages to browsers in real time, in both directions.","options":["WebSockets","Polling every 30 seconds","Server-sent events only","A batch job"],"answer":"WebSockets","back":"SSE is server-to-client only. WebSockets need a connection registry so you know which server holds each user.","learn":[{"t":"WebSocket (Wikipedia)","u":"https://en.wikipedia.org/wiki/WebSocket"},{"t":"Hello Interview: Design WhatsApp","u":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/whatsapp"}]},{"id":"system-11","type":"mcq","deck":"System design","unlock":2,"front":"Write-heavy workload that can tolerate somewhat slower reads.","options":["LSM-tree storage (Cassandra / RocksDB style)","A B-tree with many secondary indexes","Read replicas","Bigger cache"],"answer":"LSM-tree storage (Cassandra / RocksDB style)","back":"LSM: sequential appends plus background compaction, so writes are fast. Reads may touch several files (bloom filters help).","learn":[{"t":"Log-structured merge-tree (Wikipedia)","u":"https://en.wikipedia.org/wiki/Log-structured_merge-tree"},{"t":"Hello Interview: Cassandra deep dive","u":"https://www.hellointerview.com/learn/system-design/deep-dives/cassandra"}]},{"id":"system-12","type":"mcq","deck":"System design","unlock":2,"front":"Spread keys over nodes so that adding a node moves only about 1/N of them.","options":["Consistent hashing","hash(key) mod N","Range partitioning by first letter","Random placement"],"answer":"Consistent hashing","back":"With mod N, nearly every key moves when N changes. Virtual nodes even out the load on the ring.","learn":[{"t":"Consistent hashing (Wikipedia)","u":"https://en.wikipedia.org/wiki/Consistent_hashing"}]},{"id":"system-13","type":"mcq","deck":"System design","unlock":2,"front":"A rate limiter that allows short bursts but caps the average rate.","options":["Token bucket","Leaky bucket","Fixed window counter","Sliding log"],"answer":"Token bucket","back":"Tokens build up to the bucket size, which allows a burst. A leaky bucket smooths output and allows no bursts; fixed windows spike at the edges.","learn":[{"t":"Token bucket (Wikipedia)","u":"https://en.wikipedia.org/wiki/Token_bucket"},{"t":"Hello Interview: distributed rate limiter","u":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/distributed-rate-limiter"}]},{"id":"system-14","type":"mcq","deck":"System design","unlock":2,"front":"Stop a stale leader from writing after a network partition.","options":["Leases + fencing tokens","Longer heartbeat intervals","More replicas","Client-side retries"],"answer":"Leases + fencing tokens","back":"The storage layer rejects writes carrying an older fencing token, even if the old leader still believes it leads.","learn":[{"t":"Kleppmann: how to do distributed locking","u":"https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"},{"t":"AWS Builders' Library: leader election","u":"https://aws.amazon.com/builders-library/leader-election-in-distributed-systems/"}]},{"id":"system-15","type":"mcq","deck":"System design","unlock":2,"front":"A popular cache entry expires and 10K requests hit the database at once.","options":["Request coalescing (single-flight) + jittered TTLs","A bigger database instance","Shorter TTLs","Remove the cache"],"answer":"Request coalescing (single-flight) + jittered TTLs","back":"Let one request recompute the value while the others wait or get stale data. Jitter keeps keys from expiring together.","learn":[{"t":"AWS Builders' Library: caching challenges","u":"https://aws.amazon.com/builders-library/caching-challenges-and-strategies/"}]},{"id":"system-16","type":"flip","deck":"System design","unlock":2,"front":"Napkin math: seconds per day, and what 1M and 1B requests/day mean in QPS?","back":"86,400 s, about 10^5. 1M/day is about 12 QPS; 1B/day is about 12K QPS. Peak is often 2-3x the average.","learn":[{"t":"Hello Interview: core concepts","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/core-concepts"}]},{"id":"system-17","type":"flip","deck":"System design","unlock":2,"front":"Latency ladder (orders of magnitude)?","back":"Memory about 100 ns. SSD random read about 100 us. Same-datacenter round trip about 0.5 ms. Cross-continent round trip about 100 ms.","learn":[{"t":"Latency numbers every programmer should know","u":"https://gist.github.com/jboner/2841832"}]},{"id":"system-18","type":"flip","deck":"System design","unlock":2,"front":"Roughly what can one node handle before you shard or scale out?","back":"Orders of magnitude only: an in-memory cache node about 100K ops/s; a relational primary about thousands to 10K writes/s. Say 'order of magnitude' out loud.","learn":[{"t":"Hello Interview: core concepts","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/core-concepts"}]},{"id":"system-19","type":"flip","deck":"System design","unlock":2,"front":"2PC vs. saga?","back":"2PC: atomic, but it blocks and the coordinator is a failure risk. Saga: local transactions plus compensating actions, with eventual consistency. Better still: design so you need neither.","learn":[{"t":"Two-phase commit (Wikipedia)","u":"https://en.wikipedia.org/wiki/Two-phase_commit_protocol"},{"t":"microservices.io: saga pattern","u":"https://microservices.io/patterns/data/saga.html"}]},{"id":"system-20","type":"flip","deck":"System design","unlock":2,"front":"Backpressure: what are your tools?","back":"Bounded queues, load shedding, 429 + Retry-After, autoscaling consumers, and prioritizing critical traffic. Never an unbounded buffer.","learn":[{"t":"AWS Builders' Library: avoiding queue backlogs","u":"https://aws.amazon.com/builders-library/avoiding-insurmountable-queue-backlogs/"},{"t":"AWS Builders' Library: load shedding","u":"https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/"}]},{"id":"system-21","type":"flip","deck":"System design","unlock":2,"front":"Bloom filter: what is it good for?","back":"A compact set with no false negatives and tunable false positives. Use it to skip expensive lookups (crawler 'seen URLs', LSM reads).","learn":[{"t":"Bloom filter (Wikipedia)","u":"https://en.wikipedia.org/wiki/Bloom_filter"}]},{"id":"system-22","type":"flip","deck":"System design","unlock":2,"front":"The 45-minute design flow?","back":"Requirements (functional + non-functional), estimates where they matter, API and data model, high-level design, 2-3 deep dives on the hardest parts, then wrap up (bottlenecks, monitoring).","learn":[{"t":"Hello Interview: the delivery framework","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery"}]},{"id":"system-23","type":"flip","deck":"System design","unlock":2,"front":"Strong vs. eventual consistency: give an example where each is right.","back":"Strong: account balances, seat booking, inventory decrements. Eventual: like counts, feeds, view counts, recommendations.","learn":[{"t":"Eventual consistency (Wikipedia)","u":"https://en.wikipedia.org/wiki/Eventual_consistency"}]},{"id":"system-24","type":"flip","deck":"System design","unlock":2,"front":"What should drive a SQL vs. NoSQL choice?","back":"Access patterns, the need for joins/transactions, write volume and shape, and schema flexibility. Name the trade-off; don't pick by fashion.","learn":[{"t":"Hello Interview: core concepts","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/core-concepts"}]},{"id":"system-25","type":"flip","deck":"System design","unlock":2,"front":"Senior signals in a design round?","back":"You drive without prompting, quantify, compare two options before choosing, cover failure modes and monitoring, and keep it simple until scale forces otherwise.","learn":[{"t":"Hello Interview: the delivery framework","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery"}]},{"id":"concur-01","type":"mcq","deck":"Concurrency","unlock":3,"front":"Why wait on a condition inside a while loop, not an if?","options":["Spurious wakeups, and the state can change before you get the lock back","Performance","The language requires it","It prevents deadlock with other locks"],"answer":"Spurious wakeups, and the state can change before you get the lock back","back":"Always re-check the predicate after waking. This applies in every language.","learn":[{"t":"Spurious wakeup (Wikipedia)","u":"https://en.wikipedia.org/wiki/Spurious_wakeup"},{"t":"Python Condition objects","u":"https://docs.python.org/3/library/threading.html#condition-objects"}]},{"id":"concur-02","type":"mcq","deck":"Concurrency","unlock":3,"front":"Simplest reliable way to prevent deadlock when code takes several locks?","options":["Always acquire the locks in one global order","Use more threads","Sleep before each lock","Make every lock re-entrant"],"answer":"Always acquire the locks in one global order","back":"This breaks the circular-wait condition. Timeouts or tryLock with back-off are the fallback.","learn":[{"t":"Jenkov: deadlock prevention","u":"https://jenkov.com/tutorials/java-concurrency/deadlock-prevention.html"}]},{"id":"concur-03","type":"mcq","deck":"Concurrency","unlock":3,"front":"50 threads share a pool of 10 database connections.","options":["A counting semaphore initialized to 10","One mutex","A condition variable with nothing else","A spin lock"],"answer":"A counting semaphore initialized to 10","back":"A semaphore bounds concurrent access to N identical resources.","learn":[{"t":"Semaphore (Wikipedia)","u":"https://en.wikipedia.org/wiki/Semaphore_(programming)"}]},{"id":"concur-04","type":"mcq","deck":"Concurrency","unlock":3,"front":"Many threads run count++ on a shared variable marked volatile/visible.","options":["Still a race: visibility is not atomicity","Safe: visibility makes it atomic","It deadlocks","It won't compile"],"answer":"Still a race: visibility is not atomicity","back":"count++ is read-modify-write. Use an atomic integer or a lock.","learn":[{"t":"Jenkov: Java volatile","u":"https://jenkov.com/tutorials/java-concurrency/volatile.html"}]},{"id":"concur-05","type":"mcq","deck":"Concurrency","unlock":3,"front":"CPU-heavy work split across threads in CPython.","options":["Little speedup, because of the GIL; use processes","Linear speedup","It deadlocks","Faster than processes"],"answer":"Little speedup, because of the GIL; use processes","back":"Threads still help I/O-bound work. And the GIL does NOT make compound operations thread-safe.","learn":[{"t":"Global interpreter lock (Wikipedia)","u":"https://en.wikipedia.org/wiki/Global_interpreter_lock"}]},{"id":"concur-06","type":"mcq","deck":"Concurrency","unlock":3,"front":"Under a reader-preferring read-write lock, writers starve. Fix?","options":["Writer preference or a fair lock: block new readers once a writer is waiting","Add more readers","Make reads shorter","Spin-wait"],"answer":"Writer preference or a fair lock: block new readers once a writer is waiting","back":"This is a classic follow-up question in concurrency interviews.","learn":[{"t":"Readers-writers problem (Wikipedia)","u":"https://en.wikipedia.org/wiki/Readers%E2%80%93writers_problem"}]},{"id":"concur-07","type":"mcq","deck":"Concurrency","unlock":3,"front":"Producer-consumer with bounded memory.","options":["A bounded blocking queue","An unbounded list","A global variable + sleep","Busy-wait polling"],"answer":"A bounded blocking queue","back":"The producer blocks when the queue is full and the consumer blocks when it's empty. That gives you backpressure for free.","learn":[{"t":"Producer-consumer problem (Wikipedia)","u":"https://en.wikipedia.org/wiki/Producer%E2%80%93consumer_problem"}]},{"id":"concur-08","type":"mcq","deck":"Concurrency","unlock":3,"front":"Two threads keep backing off and retrying in sync; neither ever finishes. That's...","options":["Livelock","Deadlock","Starvation","A race condition"],"answer":"Livelock","back":"Livelock: the threads are active but make no progress. Deadlock: they're blocked. Starvation: one thread never gets its turn.","learn":[{"t":"Livelock (Wikipedia)","u":"https://en.wikipedia.org/wiki/Deadlock_(computer_science)#Livelock"}]},{"id":"concur-09","type":"flip","deck":"Concurrency","unlock":3,"front":"The 4 conditions required for deadlock?","back":"Mutual exclusion, hold-and-wait, no preemption, circular wait. Break any one (usually circular wait, via lock ordering).","learn":[{"t":"Deadlock (Wikipedia)","u":"https://en.wikipedia.org/wiki/Deadlock_(computer_science)"}]},{"id":"concur-10","type":"flip","deck":"Concurrency","unlock":3,"front":"What does 'happens-before' mean?","back":"A guarantee that one action's effects are visible to another (lock release before acquire, a volatile write before a read, thread start/join). Without it, threads may see stale or reordered data.","learn":[{"t":"Jenkov: the happens-before guarantee","u":"https://jenkov.com/tutorials/java-concurrency/java-happens-before-guarantee.html"},{"t":"Happened-before (Wikipedia)","u":"https://en.wikipedia.org/wiki/Happened-before"}]},{"id":"concur-11","type":"flip","deck":"Concurrency","unlock":3,"front":"Lock granularity trade-off?","back":"One coarse lock: simple and correct, but threads contend for it. Fine-grained locks or lock striping: more concurrency, more deadlock risk and complexity. Start coarse; split only where contention shows.","learn":[{"t":"Lock (Wikipedia)","u":"https://en.wikipedia.org/wiki/Lock_(computer_science)"}]},{"id":"concur-12","type":"flip","deck":"Concurrency","unlock":3,"front":"Shutting a thread pool down cleanly?","back":"Stop accepting new work, wait with a timeout for running tasks, then force-cancel the rest. Handle interruption properly instead of swallowing it.","learn":[{"t":"Java ExecutorService docs","u":"https://docs.oracle.com/javase/8/docs/api/java/util/concurrent/ExecutorService.html"}]},{"id":"concur-13","type":"flip","deck":"Concurrency","unlock":3,"front":"Double-checked locking: what's the trap?","back":"Without a memory-visibility guarantee, another thread can see a half-constructed object. Use a visibility primitive (volatile), a lazy-holder idiom, or just eager init.","learn":[{"t":"Double-checked locking (Wikipedia)","u":"https://en.wikipedia.org/wiki/Double-checked_locking"}]},{"id":"ood-01","type":"mcq","deck":"OOD","unlock":3,"front":"An elevator behaves differently when idle, moving, or with doors open.","options":["State pattern","Singleton","Factory","Adapter"],"answer":"State pattern","back":"Each state is a class that handles events and decides its own transitions.","learn":[{"t":"refactoring.guru: State pattern","u":"https://refactoring.guru/design-patterns/state"}]},{"id":"ood-02","type":"mcq","deck":"OOD","unlock":3,"front":"Swap rate-limiting algorithms without touching the callers.","options":["Strategy pattern","Observer","Decorator","Singleton"],"answer":"Strategy pattern","back":"A common interface with interchangeable implementations, chosen by config or injection.","learn":[{"t":"refactoring.guru: Strategy pattern","u":"https://refactoring.guru/design-patterns/strategy"}]},{"id":"ood-03","type":"mcq","deck":"OOD","unlock":3,"front":"Notify several displays whenever a parking spot frees up.","options":["Observer pattern","Strategy","Builder","Proxy"],"answer":"Observer pattern","back":"Subscribers register with the subject, and it publishes changes to all of them.","learn":[{"t":"refactoring.guru: Observer pattern","u":"https://refactoring.guru/design-patterns/observer"}]},{"id":"ood-04","type":"flip","deck":"OOD","unlock":3,"front":"The OOD interview flow?","back":"Clarify requirements and actors, then core entities and relationships, then interfaces and key methods, then code the main path, then discuss extensions and concurrency.","learn":[{"t":"awesome-low-level-design (problems + solutions)","u":"https://github.com/ashishps1/awesome-low-level-design"}]},{"id":"ood-05","type":"flip","deck":"OOD","unlock":3,"front":"SOLID, one line each?","back":"Single responsibility. Open for extension, closed for modification. Liskov substitution. Interface segregation. Depend on abstractions.","learn":[{"t":"SOLID (Wikipedia)","u":"https://en.wikipedia.org/wiki/SOLID"}]},{"id":"ood-06","type":"flip","deck":"OOD","unlock":3,"front":"Composition vs. inheritance: what do you say?","back":"Prefer composition (has-a) for behavior that varies; use inheritance only for true is-a relationships with shared invariants.","learn":[{"t":"Composition over inheritance (Wikipedia)","u":"https://en.wikipedia.org/wiki/Composition_over_inheritance"}]},{"id":"ood-07","type":"flip","deck":"OOD","unlock":3,"front":"What do OOD interviewers actually grade?","back":"Clear responsibilities, sensible names, extension points the requirements imply, testability, and thinking about concurrency where it matters.","learn":[{"t":"awesome-low-level-design","u":"https://github.com/ashishps1/awesome-low-level-design"},{"t":"refactoring.guru: pattern catalog","u":"https://refactoring.guru/design-patterns/catalog"}]},{"id":"behavi-01","type":"flip","deck":"Behavioral","unlock":2,"front":"STAR, the senior version?","back":"Situation in 1 line, Task = what you owned, Action = YOUR decisions and the trade-offs (most of the time goes here), Result = numbers plus what you'd do differently.","learn":[{"t":"Tech Interview Handbook: behavioral interviews","u":"https://www.techinterviewhandbook.org/behavioral-interview/"}]},{"id":"behavi-02","type":"flip","deck":"Behavioral","unlock":2,"front":"What does 'scope' mean to a senior interviewer?","back":"Impact beyond your own tasks: across teams, ambiguous problems you defined, people you grew, decisions others adopted.","learn":[{"t":"Tech Interview Handbook: behavioral interviews","u":"https://www.techinterviewhandbook.org/behavioral-interview/"}]},{"id":"behavi-03","type":"flip","deck":"Behavioral","unlock":2,"front":"How to answer 'tell me about a failure'?","back":"A real failure you owned, the change you made afterwards, and evidence that it worked. Not a humble-brag.","learn":[{"t":"Tech Interview Handbook: behavioral interviews","u":"https://www.techinterviewhandbook.org/behavioral-interview/"}]},{"id":"behavi-04","type":"flip","deck":"Behavioral","unlock":2,"front":"How to answer a conflict question?","back":"Disagree on substance, not people. Show how you sought data or the other person's constraints, what you decided together, and the relationship afterwards.","learn":[{"t":"Tech Interview Handbook: behavioral interviews","u":"https://www.techinterviewhandbook.org/behavioral-interview/"}]},{"id":"python-01","type":"flip","deck":"Python syntax","unlock":0,"front":"Python: min-heap only. How do you get a max-heap?","back":"Push -x, or (-priority, tiebreak, item).","learn":[{"t":"Python heapq docs","u":"https://docs.python.org/3/library/heapq.html"}]},{"id":"python-02","type":"flip","deck":"Python syntax","unlock":0,"front":"Python: O(1) queue for BFS?","back":"collections.deque with append / popleft. list.pop(0) is O(n).","learn":[{"t":"Python deque docs","u":"https://docs.python.org/3/library/collections.html#collections.deque"}]},{"id":"python-03","type":"flip","deck":"Python syntax","unlock":0,"front":"Python: create an m x n grid safely?","back":"[[0] * n for _ in range(m)]. [[0]*n]*m shares one row object m times.","learn":[{"t":"Python FAQ: multidimensional lists","u":"https://docs.python.org/3/faq/programming.html#how-do-i-create-a-multidimensional-list"}]},{"id":"python-04","type":"flip","deck":"Python syntax","unlock":0,"front":"Python: quickest memoization?","back":"@functools.cache on the recursive function. Its arguments must be hashable (tuples, not lists).","learn":[{"t":"functools.cache docs","u":"https://docs.python.org/3/library/functools.html#functools.cache"}]},{"id":"python-05","type":"flip","deck":"Python syntax","unlock":0,"front":"Python: first index with a[i] >= x in a sorted list?","back":"bisect.bisect_left(a, x). bisect_right gives the first index with a[i] > x.","learn":[{"t":"Python bisect docs","u":"https://docs.python.org/3/library/bisect.html"}]},{"id":"python-06","type":"flip","deck":"Python syntax","unlock":0,"front":"Python: deep recursion crashes. Two fixes?","back":"sys.setrecursionlimit(10**6), or rewrite the DFS with an explicit stack.","learn":[{"t":"sys.setrecursionlimit docs","u":"https://docs.python.org/3/library/sys.html#sys.setrecursionlimit"}]}],"state":{"version":1,"start_date":null,"tasks":{},"reviews":{},"cards":{},"notes":{},"undone":{},"level":null},"built":"2026-10-16 13:47"};

// One node per skill, in the order the plan unlocks them; gates are boss nodes.
function pathNodes() {
  const nodes = [], cur = currentPhase();
  const mk = (key, label, icon, tasks, phase, boss) => {
    const req = tasks.filter(t => !isOpt(t)), base = req.length ? req : tasks;
    const done = base.filter(t => isDone(t.id)).length, unlock = Math.min(...tasks.map(unlockOf));
    const status = unlock > cur ? "locked" : done === base.length ? "done" : done ? "active" : "open";
    nodes.push({key, label, icon, tasks: base, done, total: base.length, status, phase, boss: !!boss});
  };
  const gateNode = p => { const g = TASKS.filter(t => t.kind === "gate" && t.phase === p);
    if (g.length) mk("gate" + p, p === 4 ? "Interview ready" : `Gate ${p}`, p === 4 ? "🏆" : "🏰", g, p, true); };
  mk("ramp", "Python ramp", "🐍", TASKS.filter(t => t.phase === 0 && t.kind !== "gate"), 0); gateNode(0);

    for (const c of cats) mk("cat:" + c, c, CAT_ICON[c] || "🧠", TASKS.filter(t => t.phase === p && t.cat === c && t.track === "LeetCode core"), p);
    gateNode(p);
  }
  for (const tr of ["System design", "OOD / low-level design", "Concurrency", "Practical coding", "Debugging & code reading"])
    mk("track:" + tr, tr, CAT_ICON[tr], TASKS.filter(t => t.track === tr), 3);
  gateNode(3);
  mk("track:Behavioral", "Behavioral", "🗣️", TASKS.filter(t => t.track === "Behavioral"), 4);
  mk("track:Transfer", "Unseen problems & mocks", "🎯", TASKS.filter(t => t.track === "Transfer"), 4);
  gateNode(4);
  mk("stretch", "Bonus: stretch", "⭐", TASKS.filter(t => t.track === "Stretch"), 5);
  const here = nodes.find(n => n.status === "open" || n.status === "active");
  if (here) here.here = true;

  for (const n of nodes) {
    const phaseNodes = nodes.filter(m => m.phase === n.phase);

      }
    } else out.push(n);
  }

}

// ---------------------------------------------------------------- library (optional videos + quick reads)
function renderLibrary() {
  const el = document.getElementById("tab-library"); el.innerHTML = "";
  const all = TASKS.filter(t => t.kind === "library"), cur = currentPhase();
  const topics = [...new Set(all.map(t => t.topic))];
  UI.libMedia = UI.libMedia || "all"; UI.libTopic = UI.libTopic || "all";
  const done = all.filter(t => isDone(t.id)).length;
  const chip = (on, label, f) => h("button", {class: "chip" + (on ? " on" : ""), onclick: () => { f(); saveUI(); render(); }}, label);
  el.append(h("div", {class: "card"},
    h("b", {}, `Watch & read · ${done}/${all.length} done`),
    h("p", {class: "muted", style: "font-size:13px;margin:4px 0"}, "Optional, anytime. Nothing here blocks a gate. In 🟢 phone and 🟡 low-energy mode, What's next also suggests one item that fits your time."),
    h("div", {class: "chips"}, chip(UI.libMedia === "all", "All", () => UI.libMedia = "all"), chip(UI.libMedia === "video", "📺 Videos", () => UI.libMedia = "video"), chip(UI.libMedia === "read", "📖 Quick reads", () => UI.libMedia = "read")),
    h("div", {class: "chips"}, chip(UI.libTopic === "all", "All topics", () => UI.libTopic = "all"), topics.map(tp => chip(UI.libTopic === tp, tp, () => UI.libTopic = tp))),
    h("label", {class: "row"}, h("input", {type: "checkbox", checked: UI.hideDone, onchange: e => { UI.hideDone = e.target.checked; saveUI(); render(); }}), "Hide done")));
  for (const tp of topics) {
    if (UI.libTopic !== "all" && UI.libTopic !== tp) continue;
    const items = all.filter(t => t.topic === tp && (UI.libMedia === "all" || t.media === UI.libMedia) && (!UI.hideDone || !isDone(t.id)));
    if (!items.length) continue;
    const box = h("div", {class: "card"}, h("div", {class: "grp", style: "margin-top:0"}, tp));
    for (const t of items) {
      const dn = isDone(t.id), row = h("div", {class: "task" + (dn ? " done" : "")});
      const cb = h("input", {type: "checkbox", checked: dn, onchange: () => cb.checked ? markDone(t.id) : unmark(t.id)});
      const later = unlockOf(t) > cur ? ` · most useful from phase ${unlockOf(t)}` : "";
      row.append(cb, h("div", {class: "t"}, h("div", {class: "ttl"}, (t.media === "video" ? "📺 " : "📖 "), link(t)),
        h("div", {class: "meta"}, `${t.source} · ${t.min} min · ${EMOJI[t.tier]}${later}`), t.notes ? h("div", {class: "muted", style: "font-size:13px"}, t.notes) : null));
      box.append(row);
    }
    el.append(box);
  }
}

const b64u = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };

async function encodeState(st) { const raw = new TextEncoder().encode(JSON.stringify(st));
  if (typeof CompressionStream !== "undefined") return "IPK1." + b64u(await pipe(raw, new CompressionStream("gzip")));
  return "IPK0." + b64u(raw); }
async function decodeState(code) { code = code.replace(/\s+/g, ""); const dot = code.indexOf("."); if (dot < 0) throw new Error("That's not a progress code.");
  const pre = code.slice(0, dot); let bytes = unb64u(code.slice(dot + 1));
  if (pre === "IPK1") { if (typeof DecompressionStream === "undefined") throw new Error("This browser can't read compressed codes. Ask Claude for a plain one: kit.py export --plain"); bytes = await pipe(bytes, new DecompressionStream("gzip")); }
  else if (pre !== "IPK0") throw new Error("Unknown code version " + pre);
  return JSON.parse(new TextDecoder().decode(bytes)); }
function download(name, text) { const a = h("a", {href: URL.createObjectURL(new Blob([text], {type: "text/plain"})), download: name}); document.body.append(a); a.click(); a.remove(); }

      try { await navigator.clipboard.writeText(code); msg.textContent = "Copied to clipboard ✔"; } catch (e) { msg.textContent = "Select the text above and copy it."; } }}, "Copy progress"), out, msg));

        const front = c.type === "mcq" ? esc(c.front) + "<br><br>" + c.options.map((o, i) => "ABCD"[i] + ") " + esc(o)).join("<br>") : esc(c.front);
